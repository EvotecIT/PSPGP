name: Test PowerShell

on:
  push:
    branches: [v2-speedygonzales]
    paths-ignore: ['*.md', 'Docs/**', 'Examples/**']
  pull_request:
    branches: [v2-speedygonzales]

permissions:
  contents: read

jobs:
  package:
    name: Build module artifact
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.x'
      - name: Install package tooling
        shell: pwsh
        run: Install-Module PSPublishModule -RequiredVersion 3.0.153 -Scope CurrentUser -Force -AllowClobber
      - name: Build unsigned validation artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./Build/Build-Module.ps1 -ConfigurationGateMode Build -SignModule $false
          if ($LASTEXITCODE -ne 0) { throw "Module build failed: $LASTEXITCODE" }
          if (-not (Test-Path Artefacts/Unpacked/PSPGP/PSPGP.psd1)) { throw 'Module artifact is missing.' }
      - uses: actions/upload-artifact@v7
        with:
          name: pspgp-module
          path: Artefacts/Unpacked/PSPGP
          if-no-files-found: error

  test:
    name: '${{ matrix.os }} / ${{ matrix.shell }}'
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, shell: powershell }
          - { os: windows-latest, shell: pwsh }
          - { os: ubuntu-latest, shell: pwsh }
          - { os: macos-latest, shell: pwsh }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: pspgp-module
          path: .validation-module/PSPGP
      - name: Install test tooling
        shell: ${{ matrix.shell }}
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Test the packaged module
        shell: ${{ matrix.shell }}
        run: ./PSPGP.Tests.ps1 -ModulePath ./.validation-module/PSPGP/PSPGP.psd1
